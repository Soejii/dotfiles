general {
    before_sleep_cmd    = pidof hyprlock || hyprlock
    after_sleep_cmd     = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"; sleep 2; /home/suji/.local/bin/hypr-rescue-offscreen -q
    ignore_dbus_inhibit = false
    ignore_wayland_inhibit = true
}

# 4:30 - dim screen as a warning
listener {
    timeout    = 270
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 5 min: lock screen
listener {
    timeout    = 300
    on-timeout = pidof hyprlock || hyprlock
}

# 45 min: HARD LOCK. This listener refuses every inhibitor.
#
# The 300s listener above can be silenced by any application, through either of
# two independent channels: D-Bus (org.freedesktop.ScreenSaver, which hypridle
# counts and logs as "Inhibit locks: N") or the Wayland zwp_idle_inhibit
# protocol (which Hyprland enforces itself and never reports to hypridle at all).
#
# On 2026-08-23 Vesktop took a Wayland inhibitor and held it for 4.5 hours. The
# D-Bus counter read 0 that whole time, so hypridle looked healthy, the watchdog
# ran clean every 5 min and the waybar lamp stayed green, while the machine sat
# unlocked and awake. Confirmed by a 7-minute controlled test with the user away:
# all 24 evdev nodes silent, hyprlock never started. hypridle itself was fine and
# had correctly bound ext_idle_notifier_v1; all four of its listeners were simply
# inhibitable.
#
# ignore_inhibit makes this listener immune to BOTH channels, so the screen
# always locks eventually regardless of what any application asks for. This is
# the security floor and it deliberately has no escape hatch.
#
# Trade-off, accepted knowingly: 45 minutes with zero keyboard and mouse input
# locks regardless of what any app wants. Gamepad input does NOT reset compositor
# idle (libinput ignores joystick nodes, which is why gamepad-idle-inhibit
# exists), and ignore_inhibit bypasses that daemon's D-Bus inhibit too, verified
# by experiment 2026-08-23. So a pad-only session past 45 min will lock. That is
# the accepted cost of having a floor at all. Raise the number if it bites.
# Do NOT add a "skip if something is playing" test: that reintroduces the MPRIS
# proxy that caused the 2026-08-22 false positive, and here a wrong "Playing"
# silently reopens the security hole.
# condition_cmd runs BEFORE on-timeout: exit 0 lets the lock fire, non-zero
# defers it. condition_retry re-runs it every 60s while you stay idle, so the
# lock lands within a minute of the reason ending rather than waiting out
# another full timeout. This is what separates "watching someone's screen share"
# from "Discord leaked an inhibitor again": a real call captures the microphone,
# a leak does not. Verified both ways on 2026-08-23, and note the asymmetry that
# makes it work: leaving a call tears the mic stream down in 45s, but does NOT
# release the Wayland inhibitor.
listener {
    timeout         = 2700
    ignore_inhibit  = true
    condition_cmd   = /home/suji/.local/bin/hypridle-lock-allowed
    condition_retry = 60
    on-timeout      = pidof hyprlock || systemd-run --user --scope --quiet hyprlock
}

# 10 min: turn screen off
# Hyprland 0.56 dispatches are Lua. The old `dispatch dpms off` form is a parse
# error ("')' expected near 'off'"), so this silently did nothing. Fixed 2026-08-17.
# NOTE: `action` and its value are matched exactly; any typo falls back to
# TOGGLE without an error, so do not "simplify" these strings.
#
# The rescue call on resume (added 2026-08-22): these monitors drop their DRM
# link on DPMS-off instead of just blanking, so Hyprland briefly has zero
# outputs. Tiled windows get re-laid out when the outputs return; FLOATING ones
# keep their absolute coordinates and come back parked outside every monitor
# (the Android emulator lands at x=-1821 every time, invisible but still
# mapped and still listed by `hyprctl clients`). hypridle runs these values
# through `sh -c`, so the `;` chain is one command line, and the fork means
# `sleep` does not stall hypridle. The 2s is for the outputs to finish coming
# back: rescuing before that computes the move against a stale monitor layout.
# The same script is on Mod+SHIFT+R for the times this misses.
listener {
    timeout    = 600
    on-timeout = hyprctl dispatch "hl.dsp.dpms({ action = 'off' })"
    on-resume  = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"; sleep 2; /home/suji/.local/bin/hypr-rescue-offscreen -q
}

# 30 min: suspend
# Was disabled 2026-08-13 for the Jakarta trip (an SSH session is not "activity"
# to hypridle, so this suspends the box mid-session and drops it off the
# tailnet). Re-enabled 2026-08-17, back home. Comment out again before travelling.
listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}



