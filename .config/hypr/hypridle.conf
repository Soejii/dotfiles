general {
    before_sleep_cmd    = pidof hyprlock || hyprlock
    after_sleep_cmd     = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"
    ignore_dbus_inhibit = false
}

# 4:30 - dim screen as a warning
listener {
    timeout    = 270
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 5 min: lock screen
listener {
    timeout    = 300
    on-timeout = pidof hyprlock || hyprlock
}

# 10 min: turn screen off
# Hyprland 0.56 dispatches are Lua. The old `dispatch dpms off` form is a parse
# error ("')' expected near 'off'"), so this silently did nothing. Fixed 2026-08-17.
# NOTE: `action` and its value are matched exactly; any typo falls back to
# TOGGLE without an error, so do not "simplify" these strings.
listener {
    timeout    = 600
    on-timeout = hyprctl dispatch "hl.dsp.dpms({ action = 'off' })"
    on-resume  = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"
}

# 30 min: suspend
# Was disabled 2026-08-13 for the Jakarta trip (an SSH session is not "activity"
# to hypridle, so this suspends the box mid-session and drops it off the
# tailnet). Re-enabled 2026-08-17, back home. Comment out again before travelling.
listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}
