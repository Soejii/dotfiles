# Desktop monitors -- ASRock B550M Pro4 / RX 9060 XT (RDNA4).
# Sourced from hyprland.conf. After first boot run `hyprctl monitors all` to get
# the EXACT connector names (DP-1 / DP-2 / HDMI-A-1) and supported modes, then fix
# the lines below.
#
# Setup: ONE 2K + ONE 1080p.
#   MSI MAG 275QF  -> 2560x1440 @170Hz  (primary, high refresh)
#   27B1H2         -> 1920x1080 @100Hz  (secondary)
#
# Positions assume the 1080p sits to the RIGHT of the 2K. Swap/adjust to taste.
# (Heights differ: 1440 vs 1080. Add an explicit y-offset if you want them
#  bottom- or top-aligned, e.g. 2560x360 to vertically center the 1080p.)

monitor = DP-1,     highrr,        0x0,    1   # MSI MAG 275QF: 2560x1440 @ max refresh (~180Hz). NOTE: panel does 165/180, NOT 170 (170 was rejected -> fell back to auto).
monitor = HDMI-A-1, 1920x1080@100,  2560x0, 1   # 27B1H2 (1080p, secondary)
# catch-all so any other/unknown output still lights up
monitor = ,         preferred,     auto,   1

# Force DP-1 to be the primary: the default/first workspace opens here.
# Per-monitor workspaces: DP-1 gets IDs 1-10, HDMI-A-1 gets IDs 11-20.
# ws-switch/ws-move scripts map Mod+1-0 to the focused monitor's range.
workspace = 1, monitor:DP-1, default:true
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:DP-1
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-1
workspace = 9, monitor:DP-1
workspace = 10, monitor:DP-1
workspace = 11, monitor:HDMI-A-1, default:true
workspace = 12, monitor:HDMI-A-1
workspace = 13, monitor:HDMI-A-1
workspace = 14, monitor:HDMI-A-1
workspace = 15, monitor:HDMI-A-1
workspace = 16, monitor:HDMI-A-1
workspace = 17, monitor:HDMI-A-1
workspace = 18, monitor:HDMI-A-1
workspace = 19, monitor:HDMI-A-1
workspace = 20, monitor:HDMI-A-1
