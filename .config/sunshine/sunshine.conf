# Sunshine = the Redmi 10's side display (Moonlight on the phone).
# Streams ONLY the headless Hyprland output PHONE; see ~/redmi-gateway/README.md
sunshine_name = suji-2
capture = wlr
output_name = PHONE
encoder = vaapi
adapter_name = /dev/dri/renderD128
# A second monitor, not a game stream: keep all sound on the desktop.
stream_audio = disabled
# Listens on all interfaces, but ufw's default-deny only admits tailscale0
# (and waydroid0), so the LAN cannot reach it. Streaming needs a paired
# client; the web UI answers localhost only.
origin_web_ui_allowed = pc
