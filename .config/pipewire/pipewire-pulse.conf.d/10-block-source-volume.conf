# Stop Chromium/Electron apps from driving the hardware capture mixer.
#
# Why: Chromium's WebRTC gain control writes the *device* volume on Linux, not a
# per-stream one. Vesktop walks the Rexus Xora-II from 100% down to its ALSA base
# volume (47%) in ~45s, dragging OBS and everything else down with it. Disabling
# Discord's Automatic Gain Control does not stop it, nor does the Studio input
# profile (both verified 2026-08-10).
#
# block-source-volume makes pipewire-pulse silently drop the client's attempts to
# change source volume. Chromium still gets its gain, applied in software where it
# belongs. Documented upstream in /usr/share/pipewire/pipewire-pulse.conf.
#
# Vesktop matches as application.name = "Chromium input" (NOT "Discord", and the
# binary is vesktop.bin), so the Chromium regex is what catches it. This also
# covers Google Meet and anything else Chromium-based.
#
# Ref: https://bbs.archlinux.org/viewtopic.php?id=301041
# Remove by deleting this file and restarting pipewire-pulse.

pulse.rules = [
    {
        matches = [
            { application.name = "~Chromium.*" }
            { application.process.binary = "vesktop.bin" }
        ]
        actions = { quirks = [ block-source-volume ] }
    }
]
